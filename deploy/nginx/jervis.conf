# Jervis - LAN access via nginx (dev mode)
#
# Other devices open:  http://192.168.1.13/
#
# nginx runs on this PC and forwards:
#   /api/*  -> Jervis API   (http://127.0.0.1:4010)
#   /*      -> Vite dev UI  (http://127.0.0.1:5180, incl. HMR websocket)
#
# Install (Windows, admin PowerShell):
#   choco install nginx -y
#   copy deploy\nginx\jervis.conf C:\tools\nginx-*\conf\conf.d\jervis.conf   (or include it from nginx.conf)
#   nginx -t ; nginx -s reload
# Allow port 80 through the firewall once:
#   netsh advfirewall firewall add rule name="Jervis nginx 80" dir=in action=allow protocol=TCP localport=80

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.1.13 jervis.local localhost;

    client_max_body_size 20m;

    # API + auth cookies
    location /api/ {
        proxy_pass         http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long-running chat / voice answers
    }

    # Vite dev server + HMR websocket
    location / {
        proxy_pass         http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
